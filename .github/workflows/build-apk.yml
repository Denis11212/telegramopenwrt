name: Build telegram-openwrt (apk)

on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'Versao de release do OpenWrt (ex: 25.12.0) ou "snapshot"'
        required: true
        default: '25.12.0'

permissions:
  contents: write

env:
  PACKAGE_NAME: telegram-openwrt
  LUCI_PACKAGE_NAME: luci-app-telegramopenwrt
  SDK_BOARD: x86
  SDK_SUBTARGET: '64'

jobs:
  build_apk:
    name: Build packages (${{ inputs.openwrt_version || '25.12.0' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison gawk gettext \
            libncurses5-dev libssl-dev python3 rsync \
            unzip zlib1g-dev zstd file wget ca-certificates

      - name: Download OpenWrt SDK
        run: |
          VERSION="${{ inputs.openwrt_version || '25.12.0' }}"
          if [ "${VERSION}" = "snapshot" ]; then
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/${SDK_BOARD}/${SDK_SUBTARGET}"
          else
            BASE_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${SDK_BOARD}/${SDK_SUBTARGET}"
          fi
          echo "Procurando SDK em ${BASE_URL} ..."
          SUMS_FILE="$(mktemp)"
          curl -fsSL -o "${SUMS_FILE}" "${BASE_URL}/sha256sums"
          SDK_FILE="$(grep -o 'openwrt-sdk-[^ *]*\.tar\.zst' "${SUMS_FILE}" | head -n1)"
          if [ -z "${SDK_FILE}" ]; then
            echo "::error::Nao encontrei um SDK tarball em ${BASE_URL}"
            exit 1
          fi
          echo "Baixando ${SDK_FILE} ..."
          curl -fsSL -o "${SDK_FILE}" "${BASE_URL}/${SDK_FILE}"
          echo "Verificando checksum..."
          grep "${SDK_FILE}" "${SUMS_FILE}" | sha256sum -c -
          mkdir -p openwrt_sdk
          tar --use-compress-program=unzstd -xf "${SDK_FILE}" -C openwrt_sdk --strip-components=1

      - name: Update and install feeds
        working-directory: openwrt_sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Drop main package into SDK
        run: |
          mkdir -p openwrt_sdk/package/${PACKAGE_NAME}
          cp -R "${GITHUB_WORKSPACE}"/{Makefile,etc,sbin,usr} openwrt_sdk/package/${PACKAGE_NAME}/
          ls -lA openwrt_sdk/package/${PACKAGE_NAME}

      - name: Drop LuCI package into SDK feeds
        run: |
          # КРИТИЧНО: кладем в feeds/luci/applications/, а не в package/feeds/luci/
          # чтобы ../../luci.mk в Makefile указывал на feeds/luci/luci.mk
          mkdir -p openwrt_sdk/feeds/luci/applications/${LUCI_PACKAGE_NAME}
          cp -R "${GITHUB_WORKSPACE}/luci-app-telegramopenwrt/"* openwrt_sdk/feeds/luci/applications/${LUCI_PACKAGE_NAME}/
          ls -lA openwrt_sdk/feeds/luci/applications/${LUCI_PACKAGE_NAME}

      - name: Register LuCI package in feeds
        working-directory: openwrt_sdk
        run: |
          ./scripts/feeds install ${LUCI_PACKAGE_NAME}

      - name: Generate .config
        working-directory: openwrt_sdk
        run: |
          CONFIG_PKG_NAME="CONFIG_PACKAGE_${PACKAGE_NAME}"
          CONFIG_LUCI_NAME="CONFIG_PACKAGE_${LUCI_PACKAGE_NAME}"
          echo "${CONFIG_PKG_NAME}=m" > .config
          echo "${CONFIG_LUCI_NAME}=m" >> .config
          make defconfig
          echo "Selecao dos pacotes no .config final:"
          grep -E "${CONFIG_PKG_NAME}|${CONFIG_LUCI_NAME}" .config

      - name: Compile packages
        working-directory: openwrt_sdk
        run: |
          make package/${PACKAGE_NAME}/compile V=s -j"$(nproc)"
          make package/feeds/luci/${LUCI_PACKAGE_NAME}/compile V=s -j"$(nproc)"

      - name: Locate generated .apk files
        working-directory: openwrt_sdk
        run: |
          echo "Arquivos .apk gerados:"
          find bin/packages -name "*.apk" -print
          find bin/packages -name "${PACKAGE_NAME}*.apk" -print -quit | grep -q . \
            || { echo "::error::Nenhum .apk gerado para ${PACKAGE_NAME}"; exit 1; }
          find bin/packages -name "${LUCI_PACKAGE_NAME}*.apk" -print -quit | grep -q . \
            || { echo "::error::Nenhum .apk gerado para ${LUCI_PACKAGE_NAME}"; exit 1; }

      - name: Upload .apk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-openwrt-apk-${{ inputs.openwrt_version || '25.12.0' }}
          path: openwrt_sdk/bin/packages/*/*/*.apk
          if-no-files-found: error

      - name: Publish Release with .apk files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: telegram-openwrt ${{ github.ref_name }}
          files: openwrt_sdk/bin/packages/*/*/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
